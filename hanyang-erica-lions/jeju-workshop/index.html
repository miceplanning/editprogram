<!DOCTYPE html>
<html lang="ko">
<head>

  카카오톡 미리보기 봇은 자바스크립트를 실행하지 않고 이 아래 태그만 읽기 때문에,
  content.js의 eventName / heroTagline / heroImage 값을 바꿨다면 이 3줄도 반드시
  같은 값으로 함께 수정한 뒤 배포해주세요 (editor.html에서 자동으로 반영되지 않습니다).
  ※ 대표 사진(heroImage)이 아직 없어 og:image는 비워뒀습니다. 편집기에서 대표 사진을
  등록하면 아래에 og:image 줄을 추가해주세요.
-->
<meta property="og:title" content="한양대 ERICA LIONS 칼리지 제주워크숍" />
<meta property="og:description" content="1박 2일 제주 워크숍" />

<link rel="stylesheet" href="../../css/style.css" />
</head>
<!-- data-page 속성으로 현재 페이지를 표시합니다 (하단 탭 메뉴 활성화 표시에 사용) -->
<body data-page="home">

  <main>
    <div class="container" id="home-content">
      <!-- home.js 가 이 안에 콘텐츠를 채워 넣습니다 -->
    </div>
  </main>

  <!-- 콘텐츠 데이터 -> 공통 레이아웃 -> 홈 페이지 렌더링 순서로 불러옵니다 -->
  <script src="content.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/home.js"></script>
</body>
</html>
