<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>행사 아카이브</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/editor.css" />
<link rel="stylesheet" href="css/archive.css" />
</head>
<body class="editor-body">

  <!--
    =====================================================================
     [운영팀 전용] 행사 아카이브 목록
    =====================================================================
     - 조직/클라이언트 폴더 밑에 회차별 행사가 각자 고유 주소로 배포되어
       남아있습니다 (예: dreamtower-workshop/31st-dreamtour/).
     - 새 행사를 배포할 때마다 아래 EVENTS 배열에 항목을 하나 추가해주세요
       (이 파일은 정적 HTML이라 자동으로 갱신되지 않습니다). "다가오는 행사"
       / "지난 행사" 구분은 오늘 날짜와 비교해 자동으로 계산되므로 직접
       옮길 필요는 없습니다.
    =====================================================================
  -->

  <header class="editor-header">
    <div class="editor-header-inner">
      <div class="editor-header-text">
        <div class="editor-eyebrow">운영팀 전용 도구</div>
        <div class="editor-title">🗂️ 행사 아카이브</div>
        <div class="editor-subtitle">조직/클라이언트별로 지나간 행사와 예정된 행사를 모아봅니다</div>
      </div>
    </div>
  </header>

  <main class="editor-main archive-main">
    <div class="editor-container">

      <section class="archive-status">
        <h2 class="archive-status-title">🔜 다가오는 행사</h2>
        <div id="upcoming-groups"></div>
      </section>

      <section class="archive-status">
        <h2 class="archive-status-title">📁 지난 행사</h2>
        <div id="past-groups"></div>
      </section>

    </div>
  </main>

  <script>
    var EVENTS = [
      { org: "드림타워 워크샵", name: "31회차 · 일일 해녀로 살아보기", date: "2026-09-10", endDate: null, href: "dreamtower-workshop/31st-dreamtour/" },
      { org: "드림타워 워크샵", name: "30회차 · 약천사 사찰 투어", date: "2026-08-27", endDate: null, href: "dreamtower-workshop/30th-dreamtour/" },
      { org: "드림타워 워크샵", name: "29회차 · 제주맥주 양조장 투어", date: "2026-08-13", endDate: null, href: "dreamtower-workshop/29th-dreamtour/" },
      { org: "드림타워 워크샵", name: "28회차 · 함덕해수욕장", date: "2026-07-30", endDate: null, href: "dreamtower-workshop/28th-dreamtour/" },
      { org: "경희대 AI기술경영학과", name: "AI기술경영학과 워크샵(서울) · 동계 워크숍", date: "2026-12-10", endDate: "2026-12-12", href: "khu-ai-tech-management/seoul-workshop/" }
    ];

    function todayIso() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function eventMeta(e) {
      return e.endDate ? (e.date + " ~ " + e.endDate) : e.date;
    }

    function renderGroup(container, events, emptyText) {
      if (!events.length) {
        container.innerHTML = '<div class="archive-empty">' + emptyText + "</div>";
        return;
      }
      var byOrg = {};
      var orgOrder = [];
      events.forEach(function (e) {
        if (!byOrg[e.org]) {
          byOrg[e.org] = [];
          orgOrder.push(e.org);
        }
        byOrg[e.org].push(e);
      });
      container.innerHTML = orgOrder
        .map(function (org) {
          var cards = byOrg[org]
            .map(function (e) {
              return (
                '<a class="archive-event-card" href="' + e.href + '">' +
                '<div class="archive-event-name">' + e.name + "</div>" +
                '<div class="archive-event-meta">' + eventMeta(e) + "</div>" +
                "</a>"
              );
            })
            .join("");
          return (
            '<h3 class="archive-org-subtitle">' + org + "</h3>" +
            '<div class="archive-event-list">' + cards + "</div>"
          );
        })
        .join("");
    }

    document.addEventListener("DOMContentLoaded", function () {
      var today = todayIso();
      var upcoming = [];
      var past = [];
      EVENTS.forEach(function (e) {
        var cmpDate = e.endDate || e.date;
        (cmpDate >= today ? upcoming : past).push(e);
      });
      upcoming.sort(function (a, b) { return a.date.localeCompare(b.date); });
      past.sort(function (a, b) { return b.date.localeCompare(a.date); });
      renderGroup(document.getElementById("upcoming-groups"), upcoming, "아직 예정된 행사가 없습니다.");
      renderGroup(document.getElementById("past-groups"), past, "아직 지난 행사가 없습니다.");
    });
  </script>

</body>
</html>
