<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>행사 아카이브</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/editor.css" />
<link rel="stylesheet" href="css/archive.css" />
</head>
<body class="editor-body">

  <!--
    =====================================================================
     [운영팀 전용] 행사 아카이브 목록
    =====================================================================
     - 조직/클라이언트 폴더 밑에 회차별 행사가 각자 고유 주소로 배포되어
       남아있습니다 (예: dreamtower-workshop/31st-dreamtour/).
     - 새 행사를 이 구조로 배포할 때마다 아래 목록에 카드를 하나씩
       추가해주세요 (이 파일은 정적 HTML이라 자동으로 갱신되지 않습니다).
    =====================================================================
  -->

  <header class="editor-header">
    <div class="editor-header-inner">
      <div class="editor-header-text">
        <div class="editor-eyebrow">운영팀 전용 도구</div>
        <div class="editor-title">🗂️ 행사 아카이브</div>
        <div class="editor-subtitle">조직/클라이언트별로 지나간 행사와 진행 중인 행사를 모아봅니다</div>
      </div>
    </div>
  </header>

  <main class="editor-main archive-main">
    <div class="editor-container">

      <section class="archive-org">
        <h2 class="archive-org-title">드림타워 워크샵</h2>
        <div class="archive-event-list">
          <a class="archive-event-card" href="dreamtower-workshop/31st-dreamtour/">
            <div class="archive-event-name">31회차 · 일일 해녀로 살아보기</div>
            <div class="archive-event-meta">2026-09-10</div>
          </a>
          <a class="archive-event-card" href="dreamtower-workshop/30th-dreamtour/">
            <div class="archive-event-name">30회차 · 약천사 사찰 투어</div>
            <div class="archive-event-meta">2026-08-27</div>
          </a>
          <a class="archive-event-card" href="dreamtower-workshop/29th-dreamtour/">
            <div class="archive-event-name">29회차 · 제주맥주 양조장 투어</div>
            <div class="archive-event-meta">2026-08-13</div>
          </a>
          <a class="archive-event-card" href="dreamtower-workshop/28th-dreamtour/">
            <div class="archive-event-name">28회차 · 함덕해수욕장</div>
            <div class="archive-event-meta">2026-07-30</div>
          </a>
        </div>
      </section>

      <section class="archive-org">
        <h2 class="archive-org-title">경희대 AI학과</h2>
        <div class="archive-event-list">
          <div class="archive-empty">아직 등록된 행사가 없습니다.</div>
        </div>
      </section>

      <section class="archive-org">
        <h2 class="archive-org-title">경희대 스마트기술경영학과</h2>
        <div class="archive-event-list">
          <div class="archive-empty">아직 등록된 행사가 없습니다.</div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
